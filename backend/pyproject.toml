[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-location-recommender-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "pyarrow>=18,<23",
  "pyproj>=3.7,<4",
  "openai-agents>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["."]
