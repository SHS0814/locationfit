x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  ARTIFACT_DIR: /app/backend/artifacts/current
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  DATABASE_URL: postgresql+psycopg://kb:change-me-before-first-run@db:5432/kb
  AI_SECURITY_ENABLED: ${AI_SECURITY_ENABLED:-false}
  AI_ACCESS_CODE: ${AI_ACCESS_CODE:-}
  AI_SESSION_SECRET: ${AI_SESSION_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
  DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
  BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: change-me-before-first-run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command:
      - python
      - scripts/bootstrap_demo.py

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./outputs:/app/outputs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Only this public URL is compiled into the browser bundle.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"

volumes:
  postgres_data:
