name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kb_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kb_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Audit deployed dependencies
        run: pip-audit --disable-pip --requirement backend/requirements.lock
      - name: Audit development dependencies
        run: pip-audit --disable-pip --requirement requirements-dev.lock
      - name: Lint
        run: ruff check backend src scripts tests
      - name: Type check
        run: mypy
      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
